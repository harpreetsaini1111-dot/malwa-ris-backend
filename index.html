<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Malwa RIS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Segoe UI,Arial;
  background:#f4f6fb;
  padding:20px
}
.box{
  background:#fff;
  padding:20px;
  border-radius:12px;
  max-width:1100px;
  margin:auto
}
h2{margin-top:0}
.top-row{
  display:flex;
  gap:12px;
  align-items:flex-end;
  background:#f8fafc;
  padding:14px;
  border-radius:12px;
  border:1px solid #e5e7eb
}
.field{display:flex;flex-direction:column}
.field.small{flex:0 0 120px}
.field.medium{flex:0 0 170px}
.field.large{flex:1}
label{font-size:13px;color:#374151}
select,input{
  padding:8px 10px;
  border-radius:8px;
  border:1px solid #d1d5db;
}
.button-row{display:flex;gap:12px;margin-top:14px}
button{
  flex:1;
  padding:11px 14px;
  font-weight:600;
  border:none;
  border-radius:10px;
  cursor:pointer
}
.btn-report{background:#2563eb;color:#fff}
.btn-template{background:#059669;color:#fff}
#content{
  min-height:260px;
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:12px;
  font-family:Arial;
  background:#fff
}
pre{background:#0f172a;color:#e5e7eb;padding:12px;border-radius:8px}
.title-wrap{text-align:center;margin-bottom:10px}
.blue-title{font-size:64px;font-weight:900;letter-spacing:4px}
.blue-malwa{color:#0ea5e9}
.blue-ris{color:#64748b}
.gold-sub{text-align:center;font-weight:600;letter-spacing:2px;color:#64748b;margin-bottom:20px}
</style>
</head>

<body>

<div class="title-wrap">
  <h2 class="blue-title"><span class="blue-malwa">MALWA</span> <span class="blue-ris">RIS</span></h2>
</div>
<div class="gold-sub">Radiology Information System</div>

<div class="box">

<!-- TOP TOOLBAR -->
<div class="top-row">
  <div class="field small">
    <label>Modality</label>
    <select id="modality"><option>CT</option><option>MRI</option><option>USG</option><option>XRAY</option></select>
  </div>
  <div class="field medium">
    <label>Template Modality</label>
    <select id="templateModality" onchange="onTemplateModalityChange()"><option value="">–</option><option>CT</option><option>MRI</option><option>USG</option><option>XRAY</option></select>
  </div>
  <div class="field large">
    <label>Template</label>
    <select id="templateList" onchange="loadTemplateContent()"><option value="">Select template</option></select>
  </div>
  <div class="field large">
    <label>Filename</label>
    <input id="filename" placeholder="auto-generated">
  </div>
</div>

<br>
<label>Report / Template Content</label>
<div class="top-row" style="margin-top:6px">
  <button onclick="cmd('bold')"><b>B</b></button>
  <button onclick="cmd('italic')"><i>I</i></button>
  <button onclick="cmd('underline')"><u>U</u></button>
</div>

<div id="content" contenteditable="true"></div>

<div class="button-row">
  <button class="btn-report" onclick="saveReport()">Save REPORT</button>
  <button class="btn-template" onclick="saveTemplate()">Save TEMPLATE</button>
</div>

<hr>
<h3>Fetch Saved Reports</h3>
<div class="top-row">
  <div class="field medium"><label>Fetch Modality</label><select id="fetchModality"><option>CT</option><option>MRI</option><option>USG</option><option>XRAY</option></select></div>
  <div class="field large"><label>Patient Name</label><input id="fetchName"></div>
  <div class="field medium"><label>Date</label><input id="fetchDate" type="date"></div>
  <div class="field medium"><label>ID</label><input id="fetchId"></div>
</div>
<div class="button-row"><button class="btn-report" onclick="fetchReports()">Fetch REPORTS</button></div>
<div id="reportList"></div>

<hr>
<label>Upload Word Report (.docx)</label>
<div class="top-row">
  <div class="field medium"><label>Upload Folder</label><select id="uploadModality"><option>CT</option><option>MRI</option><option>USG</option><option>XRAY</option></select></div>
  <div class="field large"><label>Select Word File</label><input type="file" id="wordFile" accept=".docx"></div>
</div>
<div class="button-row"><button class="btn-template" onclick="uploadWordReport()">Upload & Convert</button></div>

<pre id="result">Ready</pre>
</div>

<script>
const API = "https://malwa-ris-backend.onrender.com";
function cmd(c){document.execCommand(c,false,null)}
function normalizeFilename(n){return n && n.endsWith('.html')?n:n+'.html'}

function saveReport(){
  fetch(API+'/save_report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({modality:modality.value,filename:normalizeFilename(filename.value||'report'),content:content.innerHTML})})
  .then(r=>r.json()).then(d=>result.textContent=JSON.stringify(d,null,2))
}
function saveTemplate(){
  fetch(API+'/save_template',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({modality:modality.value,filename:normalizeFilename(filename.value||'template'),content:content.innerHTML})})
  .then(r=>r.json()).then(d=>result.textContent=JSON.stringify(d,null,2))
}
function onTemplateModalityChange(){
  fetch(API+'/list_templates?modality='+templateModality.value).then(r=>r.json()).then(d=>{
    templateList.innerHTML='<option value="">Select template</option>';
    (d.templates||[]).forEach(t=>{let o=document.createElement('option');o.value=t;o.textContent=t;templateList.appendChild(o);});
  });
}
function loadTemplateContent(){
  fetch(API+`/load_template?modality=${templateModality.value}&filename=${templateList.value}`)
  .then(r=>r.json()).then(d=>{content.innerHTML=d.content||'';filename.value=templateList.value.replace(/\.html$/,'');});
}
function fetchReports(){
  fetch(API+`/list_reports?modality=${fetchModality.value}&name=${fetchName.value}&date=${fetchDate.value}&id=${fetchId.value}`)
  .then(r=>r.json()).then(d=>renderReportList(d.reports||[]));
}
function renderReportList(r){
  reportList.innerHTML=r.length?'<ul>'+r.map(x=>`<li>${x.filename}</li>`).join('')+'</ul>':'No reports found';
}
function uploadWordReport(){
  const f=wordFile.files[0];if(!f)return alert('Select file');
  const fd=new FormData();fd.append('file',f);fd.append('upload_modality',uploadModality.value);
  fetch(API+'/upload_word_report',{method:'POST',body:fd}).then(r=>r.json()).then(d=>{content.innerHTML=d.html||'';filename.value=d.filename||'';});
}
</script>

</body>
</html>
