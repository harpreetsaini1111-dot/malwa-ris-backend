<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Malwa RIS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Segoe UI,Arial;
  background:#f4f6fb;
  padding:20px
}
.box{
  background:#fff;
  padding:20px;
  border-radius:12px;
  max-width:1100px;
  margin:auto
}
.top-row{
  display:flex;
  gap:12px;
  align-items:flex-end;
  background:#f8fafc;
  padding:14px;
  border-radius:12px;
  border:1px solid #e5e7eb
}
.field{display:flex;flex-direction:column}
.field.small{flex:0 0 140px}
.field.medium{flex:0 0 180px}
.field.large{flex:1}
label{font-size:13px;color:#374151}
select,input{
  padding:8px 10px;
  border-radius:8px;
  border:1px solid #d1d5db;
}
button{
  padding:11px 14px;
  font-weight:600;
  border:none;
  border-radius:10px;
  cursor:pointer
}
.btn-report{background:#2563eb;color:#fff}
.btn-template{background:#059669;color:#fff}
#content{
  min-height:260px;
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:12px;
  background:#fff
}
pre{background:#0f172a;color:#e5e7eb;padding:12px;border-radius:8px}
.title{text-align:center;font-size:56px;font-weight:900;letter-spacing:4px;color:#0ea5e9}
.subtitle{text-align:center;color:#64748b;margin-bottom:20px;font-weight:600}
</style>
</head>

<body>

<div class="title">MALWA RIS</div>
<div class="subtitle">Radiology Information System</div>

<div class="box">

<h3>Report Details</h3>
<div class="top-row">
  <div class="field small">
    <label>Modality</label>
    <select id="reportModality">
      <option>CT</option><option>MRI</option><option>USG</option><option>XRAY</option>
    </select>
  </div>
  <div class="field large">
    <label>Patient Name</label>
    <input id="patientName">
  </div>
  <div class="field medium">
    <label>Patient ID</label>
    <input id="patientId">
  </div>
  <div class="field medium">
    <label>Date</label>
    <input id="reportDate" type="date">
  </div>
</div>

<br>

<h3>Template Details</h3>
<div class="top-row">
  <div class="field small">
    <label>Template Modality</label>
    <select id="templateModality" onchange="loadTemplateList()">
      <option value="">–</option>
      <option>CT</option><option>MRI</option><option>USG</option><option>XRAY</option>
    </select>
  </div>
  <div class="field large">
    <label>Template</label>
    <select id="templateList" onchange="loadTemplate()">
      <option value="">Select template</option>
    </select>
  </div>
</div>

<br>

<h4>Batch Upload Templates</h4>
<div class="top-row">
  <div class="field large">
    <input type="file" id="batchTemplates" multiple accept=".docx,.html">
  </div>
</div>
<br>
<button class="btn-template" onclick="batchUploadTemplates()">Upload Templates</button>

<br><br>

<label>Editor</label>
<div class="top-row">
  <select onchange="setFont(this.value)">
    <option value="">Font</option>
    <option value="Arial">Arial</option>
    <option value="Times New Roman">Times New Roman</option>
    <option value="Calibri">Calibri</option>
    <option value="Verdana">Verdana</option>
    <option value="Georgia">Georgia</option>
    <option value="Courier New">Courier New</option>
  </select>
  <select onchange="setFontSize(this.value)">
    <option value="">Size</option>
    <option value="2">Small</option>
    <option value="3">Normal</option>
    <option value="4">Large</option>
    <option value="5">X‑Large</option>
  </select>
  <button onclick="cmd('bold')"><b>B</b></button>
  <button onclick="cmd('italic')"><i>I</i></button>
  <button onclick="cmd('underline')"><u>U</u></button>
  <button onclick="cmd('insertUnorderedList')">•</button>
  <select onchange="setBulletStyle(this.value)">
    <option value="">Bullet style</option>
    <option value="disc">● Disc</option>
    <option value="circle">○ Circle</option>
    <option value="square">■ Square</option>
  </select>
  
</div>

<div id="content" contenteditable="true"></div>

<br>

<div class="top-row">
  <button class="btn-report" onclick="saveReport()">Save REPORT</button>
  <button class="btn-template" onclick="saveTemplate()">Save TEMPLATE</button>
</div>

<hr>

<h3>Batch Upload Reports (Different Patients)</h3>
<div class="top-row">
  <div class="field small">
    <label>Modality</label>
    <select id="uploadReportModality">
      <option>CT</option><option>MRI</option><option>USG</option><option>XRAY</option>
    </select>
  </div>
  <div class="field large">
    <input type="file" id="uploadReportFile" multiple accept=".docx,.html">
  </div>
</div>
<br>
<button class="btn-report" onclick="batchUploadReportsDifferentPatients()">Upload Reports</button>

<hr>

<h3>Fetch Reports</h3>
<div class="top-row">
  <div class="field small">
    <label>Modality</label>
    <select id="fetchModality">
      <option value="">ALL</option>
      <option>CT</option><option>MRI</option><option>USG</option><option>XRAY</option>
    </select>
  </div>
  <div class="field large">
    <label>Patient Name</label>
    <input id="fetchName" placeholder="Optional">
  </div>
  <div class="field medium">
    <label>Date</label>
    <input id="fetchDate" type="date">
  </div>
  <button class="btn-report" onclick="fetchReports()">Fetch</button>
</div>

<br>
<div id="reportList"></div>

<hr>

<pre id="result">Ready</pre>

</div>

<script>
console.log("JS LOADED");

// Frontend-only compatibility layer
// Do NOT change server. We adapt requests here.
const API = "https://malwa-ris-backend.onrender.com";

async function safeFetch(url, options = {}) {
  try {
    const res = await fetch(url, options);
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { data = { raw: text }; }
    if (!res.ok) {
      throw new Error(data.error || data.message || res.status + " " + res.statusText);
    }
    return data;
  } catch (err) {
    result.textContent = "ERROR: " + err.message;
    throw err;
  }
}


function cmd(c){
  document.execCommand(c,false,null);
}

function setFont(font){
  if(!font) return;
  document.execCommand('fontName', false, font);
}

function setFontSize(size){
  if(!size) return;
  document.execCommand('fontSize', false, size);
}

function setBulletStyle(style){
  if(!style) return;
  const sel = window.getSelection();
  if(!sel.rangeCount) return;
  let node = sel.anchorNode;
  while(node && node.nodeName !== 'UL'){
    node = node.parentNode;
  }
  if(node && node.style) node.style.listStyleType = style;
}

function saveReport(){
  safeFetch(API + "/save_report",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      modality:reportModality.value,
      patient_name:patientName.value || "UNKNOWN",
      patient_id:patientId.value || "AUTO",
      date:reportDate.value || new Date().toISOString().slice(0,10),
      content:content.innerHTML || ""
    })
  }).then(d=>result.textContent=JSON.stringify(d,null,2));
}

function saveTemplate(){
  if(!templateModality.value){
    result.textContent = "Select template modality first";
    return;
  }
  safeFetch(API + "/save_template",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      modality:templateModality.value,
      content:content.innerHTML || ""
    })
  }).then(d=>result.textContent=JSON.stringify(d,null,2));
}

function loadTemplateList(){
  if(!templateModality.value){
    templateList.innerHTML='<option value="">Select template</option>';
    return;
  }
  safeFetch(API + "/list_templates?modality="+templateModality.value)
  .then(d=>{
    templateList.innerHTML='<option value="">Select template</option>';
    (d.templates||[]).forEach(t=>{
      let o=document.createElement("option");
      o.value=t;
      o.textContent=t;
      templateList.appendChild(o);
    });
  });
}

function loadTemplate(){
  if(!templateList.value) return;
  safeFetch(API + `/load_template?modality=${templateModality.value}&filename=${templateList.value}`)
  .then(d=>content.innerHTML=d.content||"");
}

function batchUploadTemplates(){
  if(!templateModality.value){
    result.textContent = "Select template modality first";
    return;
  }
  const fd=new FormData();
  fd.append("modality",templateModality.value);
  for(const f of batchTemplates.files) fd.append("files",f);

  safeFetch(API+"/batch_upload_templates",{method:"POST",body:fd})
  .then(d=>result.textContent=JSON.stringify(d,null,2));
}

function batchUploadReportsDifferentPatients(){
  const fd=new FormData();
  fd.append("modality",uploadReportModality.value);
  for(const f of uploadReportFile.files) fd.append("files",f);

  safeFetch(API+"/batch_upload_reports_auto",{method:"POST",body:fd})
  .then(d=>{
    result.textContent = `Uploaded ${d.count || 0} reports
${JSON.stringify(d,null,2)}`;
  });
}

function stripHtml(html){
  const div=document.createElement('div');
  div.innerHTML=html;
  return div.innerText;
}

<html lang="en">
<head>

<style>

}
.top-row{

}
.field{display:flex;flex-direction:column}
.field.small{flex:0 0 140px}
.field.medium{flex:0 0 180px}
.field.large{flex:1}
label{font-size:13px;color:#374151}
select,input{
  padding:8px 10px;

  border:1px solid #d1d5db;

  cursor:pointer

  border-radius:10px;
  padding:12px;
  background:#fff
}

<body>

<div class="title">MALWA RIS</div>
<div class="subtitle">Radiology Information System</div>

<div class="box">

<h3>Fetch Reports</h3>
<div class="top-row">
  <div class="field small">
    <label>Modality</label>
    <select id="fetchModality">
      <option value="">ALL</option>
      <option>CT</option><option>MRI</option><option>USG</option><option>XRAY</option>
    </select>
  </div>
  <div class="field large">
    <label>Patient Name</label>
    <input id="fetchName" placeholder="Optional">
  </div>
  <div class="field medium">
    <label>Date</label>
    <input id="fetchDateFrom" type="date">
  </div>
  <button class="btn-report" onclick="fetchReports()">Fetch</button>
</div>

<br>
<div id="reportList"></div>

<hr>
<pre id="result">Ready</pre>

</div>

<script>
const API = "https://malwa-ris-backend.onrender.com";

async function safeFetch(url){
  const res = await fetch(url);
  const text = await res.text();
  return JSON.parse(text);
}

function fetchReports(){
  reportList.innerHTML = "Loading reports…";

  const params = new URLSearchParams();
  if(fetchModality.value) params.append("modality", fetchModality.value);
  if(fetchName.value) params.append("name", fetchName.value);
  if(fetchDateFrom.value) params.append("date", fetchDateFrom.value.replace(/-/g,""));

  safeFetch(API + "/list_reports?" + params.toString())
    .then(d => {
      result.textContent = JSON.stringify(d, null, 2);
      const list = d.reports || [];
      reportList.innerHTML = "";

      if(list.length === 0){
        reportList.innerHTML = "No reports found";
        return;
      }

      list.forEach(r => {
        const div = document.createElement("div");
        div.className = "top-row";
        div.style.marginBottom = "8px";
        div.innerHTML = `
          <div class="field large">
            <b>${r.filename}</b><br>
            ${r.path}
          </div>
          <button onclick="downloadReport('${r.path}','docx')">Word</button>
          <button onclick="downloadReport('${r.path}','pdf')">PDF</button>
        `;
        reportList.appendChild(div);
      });
    })
    .catch(e=>{
      result.textContent = "ERROR: " + e.message;
    });
}

function downloadReport(path,type){
  window.open(API + `/download_report?path=${encodeURIComponent(path)}&type=${type}`,'_blank');
}
</script>

</body>
</html>

</script>

</body>
</html>
