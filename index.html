<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Malwa RIS</title>

<style>
body{font-family:Segoe UI,Arial;background:#f4f6fb;padding:20px}
.box{background:#fff;padding:20px;border-radius:8px;max-width:800px}
textarea{width:100%;height:240px;font-family:Consolas}
select,input,button{padding:8px;margin-top:6px}
button{background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer}
pre{background:#0f172a;color:#e5e7eb;padding:12px;border-radius:6px}
</style>
</head>

<body>

<h2>Malwa RIS – Cloud Save Test</h2>

<div class="box">

<label>Modality</label><br>
<select id="modality">
  <option>CT</option>
  <option>MRI</option>
  <option>USG</option>
  <option>XRAY</option>
</select><br><br>

<label>Filename (example: brain_normal.html)</label><br>
<input id="filename" value="test.html"><br><br>

<label>Report / Template Content</label>
<textarea id="content">TEST CONTENT</textarea><br>

<button onclick="saveReport()">Save REPORT</button>
<button onclick="saveTemplate()">Save TEMPLATE</button>

<pre id="result">Waiting…</pre>

</div>

<script>
const API = "https://malwa-ris-backend.onrender.com";

function saveReport(){
  fetch(API + "/save_report",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      modality: modality.value,
      filename: filename.value,
      content: content.value
    })
  })
  .then(r=>r.json())
  .then(d=>result.textContent = JSON.stringify(d,null,2))
}

function saveTemplate(){
  fetch(API + "/save_template",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      modality: modality.value,
      filename: filename.value,
      content: content.value
    })
  })
  .then(r=>r.json())
  .then(d=>result.textContent = JSON.stringify(d,null,2))
}
</script>

</body>
</html>
