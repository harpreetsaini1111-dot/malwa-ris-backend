<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Malwa RIS – Test</title>

<style>
body{
    font-family:Segoe UI, Arial;
    background:#f4f6fb;
    padding:20px
}
.box{
    background:#fff;
    padding:15px;
    border-radius:8px;
    max-width:700px
}
textarea{
    width:100%;
    height:200px;
    font-family:Consolas, monospace
}
button{
    margin-top:10px;
    padding:10px 16px;
    background:#2563eb;
    border:none;
    color:#fff;
    border-radius:6px;
    cursor:pointer
}
</style>
</head>

<body>

<h2>Malwa RIS – Backend Test</h2>

<div class="box">
    <label>Patient Name</label><br>
    <input id="name"><br><br>

    <label>Report Content</label>
    <textarea id="editor">TEST REPORT CONTENT</textarea>

    <button onclick="save()">Send to Server</button>
</div>

<pre id="result"></pre>

<script>
const API = "https://malwa-ris-backend.onrender.com";

function save(){
    fetch(`${API}/reports/save`,{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
            modality:"XRAY",
            patient:{
                name: document.getElementById("name").value || "TEST",
                age:"30",
                sex:"M",
                uhid:"123",
                ref:"Dr Test",
                date:"2026-01-03"
            },
            html: document.getElementById("editor").value
        })
    })
    .then(r=>r.json())
    .then(d=>{
        document.getElementById("result").textContent =
            JSON.stringify(d,null,2);
    })
    .catch(e=>{
        document.getElementById("result").textContent =
            "ERROR:\n"+e;
    });
}
</script>

</body>
</html>
