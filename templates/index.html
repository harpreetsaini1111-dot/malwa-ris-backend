<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Malwa Diagnostic Imaging – RIS</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      margin: 20px;
    }
    h2 {
      margin-bottom: 10px;
    }
    .bar {
      background: #ffffff;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    select, input {
      margin-right: 6px;
      padding: 4px;
    }
    textarea {
      width: 100%;
      height: 350px;
      padding: 10px;
      font-size: 14px;
    }
    button {
      padding: 8px 14px;
      margin-right: 6px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-template {
      background: #2563eb;
      color: #fff;
    }
    .btn-report {
      background: #16a34a;
      color: #fff;
    }
  </style>
</head>

<body>

<h2>Malwa Diagnostic Imaging – RIS</h2>

<!-- MODE -->
<div class="bar">
  Mode:
  <select id="mode">
    <option value="template">Template Mode</option>
    <option value="report">Report Mode</option>
  </select>
</div>

<!-- MODALITY + TEMPLATE -->
<div class="bar">
  Modality:
  <select id="modality" onchange="loadTemplates()">
    <option value="USG">USG</option>
    <option value="CT">CT</option>
    <option value="MRI">MRI</option>
    <option value="XRAY">X-Ray</option>
  </select>

  Template:
  <select id="templateList" onchange="loadTemplate()">
    <option value="">-- Select Template --</option>
  </select>
</div>

<!-- PATIENT DETAILS (REPORT MODE ONLY) -->
<div class="bar" id="patientBlock" style="display:none;">
  Name <input id="name">
  Age <input id="age" size="3">
  Sex <input id="sex" size="2">
  UHID <input id="uhid">
  Ref <input id="ref">
  Date <input type="date" id="date">
</div>

<!-- EDITOR -->
<textarea id="editor" placeholder="Write or load report template here..."></textarea>

<!-- ACTIONS -->
<div class="bar">
  <button class="btn-template" onclick="saveTemplate()">Save Template</button>
  <button class="btn-report" onclick="saveReport()">Save Report</button>
</div>

<script>
/* ---------- TEMPLATE FUNCTIONS ---------- */

function loadTemplates() {
  const modality = document.getElementById("modality").value;

  fetch(`/templates?modality=${modality}`)
    .then(r => r.json())
    .then(data => {
      const sel = document.getElementById("templateList");
      sel.innerHTML = '<option value="">-- Select Template --</option>';
      data.forEach(t => {
        sel.innerHTML += `<option value="${t.id}">${t.name}</option>`;
      });
    });
}

function loadTemplate() {
  const id = document.getElementById("templateList").value;
  if (!id) return;

  fetch(`/templates/${id}`)
    .then(r => r.json())
    .then(d => {
      document.getElementById("editor").value = d.html;
    });
}

function saveTemplate() {
  if (document.getElementById("mode").value !== "template") {
    alert("Switch to Template Mode");
    return;
  }

  const name = prompt("Template name");
  if (!name) return;

  fetch("/templates/save", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      modality: document.getElementById("modality").value,
      name: name + ".html",
      html: document.getElementById("editor").value
    })
  }).then(() => alert("Template saved"));
}

/* ---------- REPORT FUNCTION ---------- */

function saveReport() {
  if (document.getElementById("mode").value !== "report") {
    alert("Switch to Report Mode");
    return;
  }

  fetch("/reports/save", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      modality: document.getElementById("modality").value,
      study: "General",
      patient: {
        name: document.getElementById("name").value,
        age: document.getElementById("age").value,
        sex: document.getElementById("sex").value,
        uhid: document.getElementById("uhid").value,
        ref: document.getElementById("ref").value,
        date: document.getElementById("date").value
      },
      final_html: document.getElementById("editor").value
    })
  })
  .then(r => r.json())
  .then(d => alert("Report saved\n" + d.link));
}

/* ---------- MODE TOGGLE ---------- */

document.getElementById("mode").addEventListener("change", e => {
  document.getElementById("patientBlock").style.display =
    e.target.value === "report" ? "block" : "none";
});
</script>

</body>
</html>
